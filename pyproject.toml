[project]
name = "timecard-client"
version = "0.1.0"
description = "Python client for a timeCard REST facade, generated from its OpenAPI specification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.23.1,<0.29.0",
  "attrs>=22.2.0",
  "python-dateutil>=2.8.0",
  "google-auth>=2.30.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Repository = "https://github.com/Hoefer-Chemie-GmbH/timecard-client-py"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timecard_client"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
